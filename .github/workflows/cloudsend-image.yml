name: Cloudsend Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: true
        default: "latest"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  IMAGE_NAME: "superbuild/cloudsend"
  GHCR_IMAGE_NAME: "ghcr.io/super-build/cloudsend"
  WEB_REPO: "Super-Build/Cloudsend-API-WEB"
  WEB_REF: "main"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            echo "image_tag cannot be empty"
            exit 1
          fi
          if [[ "${TAG}" =~ [[:space:]] ]]; then
            echo "image_tag cannot contain spaces"
            exit 1
          fi

      - name: Checkout WEB repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ env.WEB_REF }}
          path: rustdesk-api-web

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build WEB admin
        working-directory: rustdesk-api-web
        shell: bash
        run: |
          npm ci || npm install
          npm run build
          mkdir -p ../resources/admin
          cp -ar dist/* ../resources/admin/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build and packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools devscripts build-essential debhelper pkg-config

      - name: Build API binary
        shell: bash
        run: |
          go mod tidy
          echo "${{ inputs.image_tag }}" > resources/version
          CC=x86_64-linux-musl-gcc CGO_ENABLED=1 CGO_LDFLAGS="-static" GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o ./apimain ./cmd/apimain.go
          ./apimain -h >/dev/null

      - name: Prepare Docker release layout
        shell: bash
        run: |
          mkdir -p amd64/release
          cp ./apimain amd64/release/apimain
          chmod +x amd64/release/apimain
          cp -ar conf amd64/release/
          cp -ar resources amd64/release/
          cp -ar docs amd64/release/
          mkdir -p amd64/release/data amd64/release/runtime

      - name: Build amd64 deb package
        id: deb
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          VERSION="${TAG#v}"
          VERSION="$(echo "${VERSION}" | sed 's/[^A-Za-z0-9.+~]/./g')"
          if [[ ! "${VERSION}" =~ ^[0-9] ]]; then
            VERSION="0.0.0+${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          DATE="$(date -R)"
          mkdir -p debian-build/amd64/bin
          mkdir -p debian-build/amd64/data debian-build/amd64/runtime
          cp amd64/release/apimain debian-build/amd64/bin/rustdesk-api
          chmod +x debian-build/amd64/bin/rustdesk-api
          cp -vr debian systemd conf resources debian-build/amd64/
          cat debian/control.tpl | sed 's/{{ ARCH }}/amd64/' > debian-build/amd64/debian/control
          sed -i "1i rustdesk-api-server (${VERSION}) stable; urgency=medium\n\n  * Cloudsend build ${{ inputs.image_tag }}.\n\n -- GitHub Actions <actions@github.com>  ${DATE}\n" debian-build/amd64/debian/changelog
          chmod +x debian-build/amd64/debian/rules

          cd debian-build/amd64
          debuild -i -us -uc -b -aamd64

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILDARCH=amd64
          tags: local/cloudsend:${{ github.run_id }}
          load: true
          push: false

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name cloudsend-smoke -p 21114:21114 local/cloudsend:${{ github.run_id }}
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:21114/api/version" >/dev/null; then
              echo "Smoke test passed"
              docker rm -f cloudsend-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed"
          docker logs cloudsend-smoke || true
          docker rm -f cloudsend-smoke
          exit 1

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_tags
        shell: bash
        run: |
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE_NAME}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "${GHCR_IMAGE_NAME}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILDARCH=amd64
          tags: ${{ steps.docker_tags.outputs.tags }}
          push: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.image_tag }}
          name: Cloudsend ${{ inputs.image_tag }}
          files: |
            debian-build/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
