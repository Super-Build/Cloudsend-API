name: Cloudsend Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag, e.g. v1.0.0 or test-001"
        required: true
        default: "manual-latest"
      web_ref:
        description: "WEB repository branch/tag/sha"
        required: true
        default: "main"
      push_latest:
        description: "Also push superbuild/cloudsend:latest"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  IMAGE_NAME: "superbuild/cloudsend"
  WEB_REPO: "Super-Build/Cloudsend-API-WEB"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      - name: Validate image tag
        shell: bash
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "${TAG}" ]; then
            echo "image_tag cannot be empty"
            exit 1
          fi
          if [[ "${TAG}" =~ [[:space:]] ]]; then
            echo "image_tag cannot contain spaces"
            exit 1
          fi

      - name: Checkout WEB repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ inputs.web_ref }}
          path: rustdesk-api-web
          token: ${{ secrets.WEB_REPO_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build WEB admin
        working-directory: rustdesk-api-web
        shell: bash
        run: |
          npm ci || npm install
          npm run build
          mkdir -p ../resources/admin
          cp -ar dist/* ../resources/admin/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install musl toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build API binary
        shell: bash
        run: |
          go mod tidy
          CC=x86_64-linux-musl-gcc CGO_ENABLED=1 CGO_LDFLAGS="-static" GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o ./apimain ./cmd/apimain.go
          ./apimain -h >/dev/null

      - name: Prepare Docker release layout
        shell: bash
        run: |
          mkdir -p amd64/release
          cp ./apimain amd64/release/apimain
          chmod +x amd64/release/apimain
          cp -ar conf amd64/release/
          cp -ar resources amd64/release/
          cp -ar docs amd64/release/
          mkdir -p amd64/release/data amd64/release/runtime

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILDARCH=amd64
          tags: local/cloudsend:${{ github.run_id }}
          load: true
          push: false

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name cloudsend-smoke -p 21114:21114 local/cloudsend:${{ github.run_id }}
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:21114/api/version" >/dev/null; then
              echo "Smoke test passed"
              docker rm -f cloudsend-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed"
          docker logs cloudsend-smoke || true
          docker rm -f cloudsend-smoke
          exit 1

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_tags
        shell: bash
        run: |
          TAGS="${IMAGE_NAME}:${{ inputs.image_tag }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_NAME}:latest"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${TAGS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILDARCH=amd64
          tags: ${{ steps.docker_tags.outputs.tags }}
          push: true
